<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b8cf7"/>
      <stop offset="55%" style="stop-color:#6a5fd0"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <radialGradient id="sheen" cx="26%" cy="16%" r="68%">
      <stop offset="0%" style="stop-color:#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" style="stop-color:#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="helix" x1="0%" y1="0%" x2="0%" y2="100%">
